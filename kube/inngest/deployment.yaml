apiVersion: apps/v1
kind: Deployment

metadata:
  name: nextcrm-inngest
  namespace: ynoacamino
  labels:
    app: nextcrm-inngest

spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcrm-inngest
  template:
    metadata:
      labels:
        app: nextcrm-inngest
    spec:
      containers:
        - name: inngest
          image: inngest/inngest:latest
          command:
            - inngest
            - dev
            - -u
            - http://nextcrm:3000/api/inngest
          ports:
            - name: inngest
              containerPort: 8288
