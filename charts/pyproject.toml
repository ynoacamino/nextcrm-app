[project]
name = "k6-charts"
version = "0.1.0"
description = "Genera gráficas y tablas de calidad de publicación desde la salida de k6"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
]

[project.scripts]
k6-charts = "k6_charts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k6_charts"]

[tool.hatch.build.targets.wheel.shared-data]
"styles/k6_report.mplstyle" = "share/k6_charts/styles/k6_report.mplstyle"
